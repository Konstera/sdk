name: release-cli

# Publishes the Konstera CLI via GoReleaser.
#
# Tag convention: cli-v<X.Y.Z>  (e.g. cli-v0.1.0)
#
# Outputs:
#   - GitHub Release with cross-compiled archives (linux/darwin/windows × amd64/arm64)
#   - Homebrew tap updated at Konstera/homebrew-tap
#   - Scoop bucket updated at Konstera/scoop-bucket
#   - Claude Desktop extensions (konstera-windows-x64.mcpb,
#     konstera-windows-arm64.mcpb, konstera-macos.mcpb), packed from the
#     GoReleaser binaries, started on a real Windows/macOS runner, then
#     attached to the same release (jobs mcpb-verify, mcpb-attach)
#   - (future) winget manifest PR'd against Konstera/winget-pkgs
#
# First-release setup: NONE — GITHUB_TOKEN is auto-provided by Actions.
# Tag cli-v<X.Y.Z> on main, push, and GitHub Release lands with per-OS
# binaries. The homebrew-tap + scoop-bucket companion repos are optional
# follow-ups documented in cli/.goreleaser.yml and the two *_GITHUB_TOKEN
# env vars below stay unset until those are created.

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write  # for GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/cli-v}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # --skip=validate turns off GoReleaser's git-state validator which
          # otherwise verifies that a git tag matching GORELEASER_CURRENT_TAG
          # (v0.1.0) is pointed at HEAD. In our monorepo the real git tag
          # is `cli-v0.1.0` — the override makes GoReleaser *think* the tag
          # is `v0.1.0`, but no such git tag actually exists. Skipping
          # validate is the documented monorepo workaround.
          args: release --clean --skip=validate
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser v2 (OSS) strictly parses the whole git tag as semver;
          # the `monorepo` block that strips a tag prefix is Pro-only. We
          # work around that by passing the pre-stripped version via
          # GORELEASER_CURRENT_TAG — GoReleaser treats this as authoritative
          # and never looks at the raw git tag.
          #
          # GORELEASER_PREVIOUS_TAG="" disables previous-tag detection so
          # GoReleaser doesn't walk git history and pick up a sibling
          # package's tag (e.g. sdk-ts-v0.4.4) as "the previous CLI
          # release." Changelog is also disabled in the config.
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}
          GORELEASER_PREVIOUS_TAG: ""
          # Only consumed when brews + scoops blocks in cli/.goreleaser.yml
          # are uncommented. Harmless when the secrets are unset — GoReleaser
          # only reads them for the blocks that reference them.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}

      # Claude Desktop extension. Packed here, on Linux, so the macOS binary
      # keeps its executable bit inside the bundle (see cli/mcpb/pack.sh).
      # pack.sh unpacks each bundle again and checks version, binary and mode.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli/mcpb/package-lock.json

      - name: Pack Claude Desktop extensions (.mcpb)
        working-directory: cli/mcpb
        run: |
          npm ci --no-audit --no-fund
          bash ./pack.sh "${{ steps.version.outputs.version }}" ../dist ../dist-mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: cli/dist-mcpb/
          if-no-files-found: error

  # Start each bundle on the OS it is for, the way Claude Desktop does
  # (cli/mcpb/smoke.mjs): unpack, resolve the manifest command, initialize,
  # tools/list. Only bundles that pass are attached to the release.
  mcpb-verify:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            bundle: konstera-windows-x64.mcpb
          - runner: windows-11-arm
            bundle: konstera-windows-arm64.mcpb
          - runner: macos-latest
            bundle: konstera-macos.mcpb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cli/mcpb

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: mcpb-out

      - name: Smoke-test ${{ matrix.bundle }}
        shell: bash
        working-directory: cli/mcpb
        run: |
          npm ci --no-audit --no-fund
          node smoke.mjs "../../mcpb-out/${{ matrix.bundle }}" "${{ needs.release.outputs.version }}"

  mcpb-attach:
    needs: [release, mcpb-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: mcpb-out

      # GoReleaser names the release after the stripped tag (v<X.Y.Z>).
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.release.outputs.version }}" mcpb-out/* \
            --repo "${{ github.repository }}" --clobber
