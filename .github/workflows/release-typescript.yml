name: release-typescript

# Publishes TypeScript SDK packages to npm.
#
# Tag conventions (see RELEASING.md):
#   sdk-ts-contexts-v<X.Y.Z>  -> publishes konstera-sdk-contexts
#   sdk-ts-v<X.Y.Z>           -> publishes konstera-sdk  (added in Phase 1.5)
#
# Required secrets (one-time setup, see RELEASING.md):
#   NPM_TOKEN  — npm classic automation token with publish scope.
#   (Future: migrate to OIDC trusted publishing after first manual publish.)

on:
  push:
    tags:
      - "sdk-ts-contexts-v*"
      - "sdk-ts-v*"

jobs:
  publish-contexts:
    name: Publish konstera-sdk-contexts to npm
    if: startsWith(github.ref, 'refs/tags/sdk-ts-contexts-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for npm --provenance
      contents: write  # for GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/sdk-ts-contexts-v}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches package.json
        working-directory: typescript/packages/konstera-sdk-contexts
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package.json: $PKG_VERSION"
          echo "tag:          ${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json version '$PKG_VERSION' does not match tag 'sdk-ts-contexts-v${{ steps.version.outputs.version }}'."
            exit 1
          fi

      - name: Regenerate from pack JSON (drift check)
        run: |
          python scripts/generate_constants.py
          if ! git diff --exit-code typescript/packages/konstera-sdk-contexts/src/generated.ts; then
            echo "::error::Generated TypeScript constants are out of sync with schemas/standard-context-pack-v1.json. Run 'python scripts/generate_constants.py' and commit before tagging."
            exit 1
          fi

      - name: Install workspace deps
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Build
        working-directory: typescript/packages/konstera-sdk-contexts
        run: pnpm run build

      - name: Smoke-test the packed package (require + import)
        # tsc output can pass build + tests yet not load from the tarball
        # (konstera-sdk-contexts 1.0.0 shipped that way). Install the packed
        # tarball into an empty project and load it both ways before publishing.
        working-directory: typescript/packages/konstera-sdk-contexts
        run: |
          TARBALL="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/$TARBALL"
          node -e "require('konstera-sdk-contexts')"
          node --input-type=module -e "await import('konstera-sdk-contexts')"

      - name: Publish to npm (with provenance)
        working-directory: typescript/packages/konstera-sdk-contexts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Published to npm: https://www.npmjs.com/package/konstera-sdk-contexts/v/${{ steps.version.outputs.version }}

            Install:
            ```
            npm install konstera-sdk-contexts@${{ steps.version.outputs.version }}
            ```

  publish-sdk-ts:
    name: Publish konstera-sdk to npm
    if: startsWith(github.ref, 'refs/tags/sdk-ts-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for npm --provenance
      contents: write  # for GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/sdk-ts-v}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches package.json
        working-directory: typescript/packages/konstera-sdk
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package.json: $PKG_VERSION"
          echo "tag:          ${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json version '$PKG_VERSION' does not match tag 'sdk-ts-v${{ steps.version.outputs.version }}'."
            exit 1
          fi

      - name: Install workspace deps
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Build
        working-directory: typescript/packages/konstera-sdk
        run: pnpm run build

      - name: Test
        working-directory: typescript/packages/konstera-sdk
        run: pnpm test

      - name: Smoke-test the packed package (require + import)
        # tsc output can pass build + tests yet not load from the tarball
        # (konstera-sdk-contexts 1.0.0 shipped that way). Install the packed
        # tarball into an empty project and load it both ways before publishing.
        working-directory: typescript/packages/konstera-sdk
        run: |
          TARBALL="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/$TARBALL"
          node -e "require('konstera-sdk')"
          node --input-type=module -e "await import('konstera-sdk')"

      - name: Publish to npm (with provenance)
        working-directory: typescript/packages/konstera-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Published to npm: https://www.npmjs.com/package/konstera-sdk/v/${{ steps.version.outputs.version }}

            Install:
            ```
            npm install konstera-sdk@${{ steps.version.outputs.version }}
            ```
