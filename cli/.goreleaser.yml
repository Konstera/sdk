# GoReleaser config for the Konstera CLI (sdk/cli/).
#
# Triggered by `cli-v<X.Y.Z>` tags in the sdk/ repo via
# .github/workflows/release-cli.yml. Produces cross-compiled binaries for
# Linux + macOS + Windows (x86_64 + arm64), publishes a GitHub Release
# with per-platform archives, and updates the brew tap + scoop bucket +
# winget manifest in the companion repos.
#
# Local dry-run: `goreleaser release --snapshot --clean --skip=publish`
#
# https://goreleaser.com/

version: 2

project_name: konstera

before:
  hooks:
    - go mod tidy

builds:
  - id: konstera
    main: ./cmd/konstera
    binary: konstera
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/Konstera/sdk/cli/internal/version.Version={{.Version}}
      - -X github.com/Konstera/sdk/cli/internal/version.Commit={{.Commit}}
      - -X github.com/Konstera/sdk/cli/internal/version.Date={{.CommitDate}}

archives:
  - id: default
    name_template: >-
      konstera_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# Homebrew tap + Scoop bucket are commented out for the first release.
# The first `cli-v0.1.0` tag ships GitHub Release binaries only (zero one-
# time setup). To enable the package-manager install UX later:
#
#   1. Create https://github.com/Konstera/homebrew-tap     (empty public repo)
#   2. Create https://github.com/Konstera/scoop-bucket     (empty public repo)
#   3. Mint a GitHub PAT with `contents: write` on both; add as repo
#      secrets HOMEBREW_TAP_GITHUB_TOKEN + SCOOP_BUCKET_GITHUB_TOKEN on
#      THIS sdk repo (Settings → Secrets → Actions).
#   4. Uncomment the blocks below, bump cli version, tag, push — the next
#      release updates the tap + bucket automatically.
#
# Doing this out of band lets the plumbing land + first release prove itself
# before we add the two companion repos.

