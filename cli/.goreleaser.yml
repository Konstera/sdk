# GoReleaser config for the Konstera CLI (sdk/cli/).
#
# Triggered by `cli-v<X.Y.Z>` tags in the sdk/ repo via
# .github/workflows/release-cli.yml. Produces cross-compiled binaries for
# Linux + macOS + Windows (x86_64 + arm64), publishes a GitHub Release
# with per-platform archives, and updates the brew tap + scoop bucket +
# winget manifest in the companion repos.
#
# Local dry-run: `goreleaser release --snapshot --clean --skip=publish`
#
# https://goreleaser.com/

version: 2

project_name: konstera

# The sdk/ repo is a monorepo (python/, dotnet/, typescript/, cli/, devx-mcp/)
# with per-package release workflows and per-package tag prefixes (python-v*,
# dotnet-v*, cli-v*, …). GoReleaser v2 (OSS) strictly parses the whole tag as
# semver and the `monorepo` block that handles prefix-stripping is Pro-only.
#
# Workaround: the workflow (.github/workflows/release-cli.yml) strips the
# `cli-` prefix in a shell step and passes the clean semver through to
# GoReleaser via the GORELEASER_CURRENT_TAG env var. GoReleaser then sees
# a valid v0.1.0 tag and ships the release. Nothing in this config
# references the raw git tag directly, so the override is complete.
#
# changelog.disable=true below sidesteps the related previous-tag problem:
# with no monorepo filter, GoReleaser's "find previous tag" step would
# pick up the latest sibling package release (e.g. sdk-ts-v0.4.4) and
# generate a changelog diff that mixes CLI + TypeScript SDK commits. For
# the first release there's nothing to compare against anyway; when we
# add changelog support later it'll be via a hand-maintained
# cli/CHANGELOG.md referenced here.

before:
  hooks:
    - go mod tidy

builds:
  - id: konstera
    main: ./cmd/konstera
    binary: konstera
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/Konstera/sdk/cli/internal/version.Version={{.Version}}
      - -X github.com/Konstera/sdk/cli/internal/version.Commit={{.Commit}}
      - -X github.com/Konstera/sdk/cli/internal/version.Date={{.CommitDate}}

archives:
  - id: default
    name_template: >-
      konstera_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # See header comment: monorepo-wide tag history makes the auto-changelog
  # mix commits from sibling packages (python/, dotnet/, typescript/, …).
  # Disabled for now; a later slice adds a hand-maintained cli/CHANGELOG.md
  # and references it here via release.extra_files or similar.
  disable: true

# Homebrew tap + Scoop bucket are commented out for the first release.
# The first `cli-v0.1.0` tag ships GitHub Release binaries only (zero one-
# time setup). To enable the package-manager install UX later:
#
#   1. Create https://github.com/Konstera/homebrew-tap     (empty public repo)
#   2. Create https://github.com/Konstera/scoop-bucket     (empty public repo)
#   3. Mint a GitHub PAT with `contents: write` on both; add as repo
#      secrets HOMEBREW_TAP_GITHUB_TOKEN + SCOOP_BUCKET_GITHUB_TOKEN on
#      THIS sdk repo (Settings → Secrets → Actions).
#   4. Uncomment the blocks below, bump cli version, tag, push — the next
#      release updates the tap + bucket automatically.
#
# Doing this out of band lets the plumbing land + first release prove itself
# before we add the two companion repos.

